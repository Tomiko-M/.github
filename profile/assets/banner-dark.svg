<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="tomiko. Record once. Replay forever.">
  <defs>
    <radialGradient id="glowA" cx="980" cy="200" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0885b" stop-opacity=".30"/>
      <stop offset="1" stop-color="#f0885b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="120" cy="460" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2491f" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c2491f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#c2491f"/>
      <stop offset=".5" stop-color="#f0885b"/>
      <stop offset="1" stop-color="#ffb08a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="fade" cx="760" cy="210" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="420" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0e0d0c"/>
    <rect width="1280" height="420" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>
    <rect width="1280" height="6" fill="url(#bar)"/>

    <!-- pill -->
    <g transform="translate(88 78)">
      <rect width="262" height="34" rx="17" fill="#f0885b" fill-opacity=".10" stroke="#f0885b" stroke-opacity=".35"/>
      <circle cx="20" cy="17" r="5" fill="#f0885b">
        <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="22" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#f0885b" letter-spacing=".5">REC · v0.1 on npm · MIT</text>
    </g>

    <!-- wordmark -->
    <text x="82" y="222" font-family="'Geist','Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="118" font-weight="800" letter-spacing="-5" fill="#f1e9dc">tomiko<tspan fill="#f0885b">.</tspan></text>

    <text x="88" y="282" font-family="'Geist','Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="36" font-weight="650" letter-spacing="-1" fill="#f1e9dc">Record once. Replay <tspan font-family="'Instrument Serif',ui-serif,Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" font-size="40" fill="#f0885b">forever.</tspan></text>
    <text x="88" y="326" font-family="'Geist','Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#a39789">Deterministic LLM tests — offline, in milliseconds, for zero tokens.</text>
    <text x="88" y="368" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#6f665d"><tspan fill="#f0885b">$</tspan> npm i -D tomiko</text>

    <!-- cassette -->
    <g transform="translate(980 212) rotate(-5)">
      <g transform="translate(-205 -132)">
        <animateTransform attributeName="transform" type="translate" values="-205 -132; -205 -138; -205 -132" dur="6s" repeatCount="indefinite"/>
        <rect width="410" height="264" rx="22" fill="#1f1b18" stroke="#4a413a" stroke-width="3"/>
        <circle cx="20" cy="20" r="5" fill="#4a413a"/><circle cx="390" cy="20" r="5" fill="#4a413a"/>
        <circle cx="20" cy="244" r="5" fill="#4a413a"/><circle cx="390" cy="244" r="5" fill="#4a413a"/>
        <rect x="30" y="24" width="350" height="160" rx="12" fill="#efe6d8"/>
        <path d="M30 36a12 12 0 0 1 12-12h326a12 12 0 0 1 12 12v8H30z" fill="#f0885b"/>
        <text x="50" y="76" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#3a332d">agent/booking.test.ts</text>
        <circle cx="330" cy="71" r="5" fill="#e5484d">
          <animate attributeName="opacity" values="1;1;.15;1" keyTimes="0;.5;.75;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="341" y="76" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#e5484d">REC</text>
        <line x1="50" y1="90" x2="360" y2="90" stroke="#3a332d" stroke-opacity=".18" stroke-width="2"/>
        <rect x="80" y="100" width="250" height="72" rx="36" fill="#0c0b0a"/>
        <rect x="150" y="124" width="110" height="24" rx="4" fill="#5a4636" fill-opacity=".7"/>
        
    <g transform="translate(130 136)">
      <circle r="35" fill="#5a4636"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/>
        <circle r="25" fill="#efe6d8"/>
        <rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(0)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(60)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(120)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(180)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(240)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(300)"/>
        <circle r="6" fill="#f0885b"/>
      </g>
    </g>
        
    <g transform="translate(280 136)">
      <circle r="35" fill="#5a4636"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/>
        <circle r="25" fill="#efe6d8"/>
        <rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(0)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(60)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(120)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(180)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(240)"/><rect x="-2.6" y="-21" width="5.2" height="16" rx="2.6" fill="#0c0b0a" transform="rotate(300)"/>
        <circle r="6" fill="#f0885b"/>
      </g>
    </g>
        <path d="M70 264l22-56h226l22 56z" fill="#2b2622"/>
        <circle cx="150" cy="236" r="6" fill="#0c0b0a"/><circle cx="260" cy="236" r="6" fill="#0c0b0a"/>
      </g>
    </g>
  </g>
</svg>
